<!doctype html>
<html lang="pt">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>$title</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Ccircle cx='16' cy='20' r='9' fill='%2322d3ee'/%3E%3Crect x='2' y='19' width='28' height='3' rx='1.5' fill='%230e7490'/%3E%3C/svg%3E">
<style>
:root{--bg:#f6f7f9;--card:#fff;--ink:#16181d;--muted:#5b6270;--line:#e3e6eb;--accent:#0e7490;--accent-ink:#fff;--ok:#15803d;--warn:#b45309;--chip:#eef1f5;--shadow:0 1px 2px rgba(0,0,0,.06)}
@media (prefers-color-scheme:dark){:root{--bg:#0f1115;--card:#181b21;--ink:#e8eaee;--muted:#9aa3b2;--line:#2a2f38;--accent:#22d3ee;--accent-ink:#06232a;--ok:#4ade80;--warn:#fbbf24;--chip:#232831;--shadow:none}}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.45 system-ui,-apple-system,"Segoe UI",sans-serif}
a{color:inherit}
.wrap{max-width:1320px;margin:auto;padding:0 16px}
header{padding:18px 0 6px;display:flex;flex-wrap:wrap;gap:10px 16px;align-items:center}
header h1{margin:0;font-size:22px;letter-spacing:-.01em}
header h1 a{text-decoration:none}
header .sub{color:var(--muted);font-size:13px}
form.search{margin-left:auto;display:flex;gap:6px}
form.search input{border:1px solid var(--line);background:var(--card);color:var(--ink);border-radius:999px;padding:7px 14px;font:inherit;width:min(280px,60vw)}
.tabs,.filters{display:flex;flex-wrap:wrap;gap:8px;padding:6px 0}
.tabs a,.filters a,.btn,select{border:1px solid var(--line);background:var(--card);color:var(--ink);padding:6px 12px;border-radius:999px;text-decoration:none;font:inherit;font-size:13px;cursor:pointer}
select{padding:5px 10px;border-radius:10px}
.tabs a{font-weight:600}
.tabs a.on,.filters a.on{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.filters .label{color:var(--muted);font-size:12px;align-self:center;margin-right:2px}
.btn:disabled{opacity:.6;cursor:default}
.btn.primary{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(232px,1fr));gap:14px;padding:12px 0 24px}
.card{background:var(--card);border:1px solid var(--line);border-radius:14px;overflow:hidden;display:flex;flex-direction:column;box-shadow:var(--shadow)}
.cover{position:relative;display:block;aspect-ratio:3/4;background:var(--chip)}
.cover a{display:block;height:100%}
.cover img{width:100%;height:100%;object-fit:cover;display:block}
.play{position:absolute;right:8px;bottom:8px;border:0;border-radius:999px;background:rgba(0,0,0,.65);color:#fff;padding:6px 11px;font-size:13px;cursor:pointer}
.badges{position:absolute;left:8px;top:8px;display:flex;flex-direction:column;gap:4px;align-items:flex-start}
.badge{background:rgba(0,0,0,.7);color:#fff;border-radius:6px;padding:2px 7px;font-size:11px;font-weight:600}
.badge.ok{background:#15803d}.badge.dl{background:#1d4ed8}.badge.wish{background:#a16207}.badge.mon{background:#6d28d9}
.body{padding:10px 12px 12px;display:flex;flex-direction:column;gap:6px;flex:1}
.name{font-weight:650;font-size:15px;line-height:1.25}
.name a{text-decoration:none}
.meta{color:var(--muted);font-size:12px}
.summary{font-size:13px;color:var(--ink);opacity:.9;display:-webkit-box;-webkit-line-clamp:4;-webkit-box-orient:vertical;overflow:hidden;cursor:pointer}
.summary.open{-webkit-line-clamp:unset}
.chips{display:flex;flex-wrap:wrap;gap:4px}
.chip{background:var(--chip);border-radius:6px;padding:1px 7px;font-size:11px}
.avail{color:var(--ok);font-size:12px;font-weight:600}
.noavail{color:var(--muted);font-size:12px}
.price{font-size:12px}
.acts{display:flex;gap:6px;flex-wrap:wrap;margin-top:auto;padding-top:4px}
.acts .btn{padding:4px 10px;font-size:12px}
.empty{color:var(--muted);padding:48px 0;text-align:center}
.pager{display:flex;gap:8px;justify-content:center;padding:4px 0 40px}
.detail{display:grid;grid-template-columns:minmax(0,260px) minmax(0,1fr);gap:24px;padding:18px 0}
.detail img.big{width:100%;border-radius:14px;display:block}
.detail h2{margin:0 0 6px;font-size:26px}
.shots{display:grid;grid-template-columns:repeat(auto-fill,minmax(240px,1fr));gap:10px;margin:12px 0}
.shots img{width:100%;border-radius:10px;display:block}
.video{position:relative;aspect-ratio:16/9;border-radius:12px;overflow:hidden;background:#000;margin:10px 0}
.video iframe{position:absolute;inset:0;width:100%;height:100%;border:0}
.facts{display:grid;grid-template-columns:max-content 1fr;gap:4px 14px;font-size:14px;margin:12px 0}
.facts dt{color:var(--muted)}.facts dd{margin:0}
.cal{padding:6px 0 40px;max-width:860px}
.cal-month{margin:22px 0 4px;font-size:18px}
.cal-day{color:var(--muted);font-size:13px;font-weight:600;margin:12px 0 4px;text-transform:uppercase;letter-spacing:.04em}
.cal-row{display:grid;grid-template-columns:44px 1fr auto;gap:10px;align-items:center;background:var(--card);border:1px solid var(--line);border-radius:10px;padding:6px 8px;margin:4px 0}
.cal-row img{width:44px;height:58px;object-fit:cover;border-radius:6px;display:block}
.cal-row .name{text-decoration:none;font-weight:600}
dialog{border:0;border-radius:14px;padding:0;width:min(960px,94vw);background:#000}
dialog::backdrop{background:rgba(0,0,0,.7)}
dialog .close{position:absolute;right:8px;top:8px;z-index:2;border:0;border-radius:999px;padding:6px 11px;cursor:pointer}
@media (max-width:640px){.detail{grid-template-columns:1fr}.detail img.big{max-width:220px}form.search{margin-left:0;width:100%}form.search input{flex:1;width:auto}.grid{grid-template-columns:repeat(auto-fill,minmax(160px,1fr))}}
</style>
</head>
<body>
<div class="wrap">
$body
</div>
<dialog id="player"><button class="close" onclick="closePlayer()">✕</button><div class="video" style="margin:0"><iframe id="frame" allow="autoplay; encrypted-media; picture-in-picture" allowfullscreen></iframe></div></dialog>
<script>
async function act(btn, url, done){
  btn.disabled = true; const label = btn.textContent; btn.textContent = '…';
  try {
    const r = await fetch(url, {method: 'POST'}); const j = await r.json();
    btn.textContent = j.ok ? '✓ ' + (j.msg || 'feito') : '✗ ' + (j.msg || 'erro');
    if (!j.ok) btn.disabled = false;
    if (j.ok && done) done(j);
  } catch (e) { btn.textContent = '✗ erro'; btn.disabled = false; setTimeout(() => btn.textContent = label, 3000); }
}
function play(id){ document.getElementById('frame').src = 'https://www.youtube-nocookie.com/embed/' + id + '?autoplay=1'; document.getElementById('player').showModal(); }
function closePlayer(){ document.getElementById('frame').src = ''; document.getElementById('player').close(); }
document.getElementById('player').addEventListener('close', () => document.getElementById('frame').src = '');
document.addEventListener('click', e => { if (e.target.classList.contains('summary')) e.target.classList.toggle('open'); });
</script>
</body>
</html>
